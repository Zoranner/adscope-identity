[workspace]
members = [
    "center",
    "connector",
]
exclude = [
    "crates/protocol",
    "crates/store",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["json"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
http-body-util = "0.1.3"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "2.0.0-rc.38", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1.41"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows-service = "0.8.1"
