services:
  center:
    image: adscope-center:0.1.0
    restart: unless-stopped
    env_file:
      - center.env
    volumes:
      - adscope-center-data:/data
      - ./oidc-private-key.pem:/run/secrets/oidc-private-key.pem:ro
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  adscope-center-data:
