services:
  portal:
    image: ghcr.io/example/adscope-portal:0.2.0
    restart: unless-stopped
    env_file:
      - .env
    # Portal 固定监听容器内 18086；前置代理负责对外入口。
    ports:
      - "127.0.0.1:18086:18086"
    volumes:
      - ./certs:/run/certs:ro
networks:
  default:
    external: true
    name: adscope
