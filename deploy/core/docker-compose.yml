services:
  core:
    image: ghcr.io/zoranner/adscope-core:0.4.0
    container_name: adscope-core
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - 8080:8080
    env_file:
      - .env
    volumes:
      - ./app/secrets:/run/secrets:ro
  postgres:
    image: postgres:16
    container_name: adscope-postgres
    restart: always
    stop_signal: SIGINT
    environment:
      - POSTGRES_DB=adscope
      - POSTGRES_USER=adscope
      - POSTGRES_PASSWORD=adscope
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U adscope -d adscope'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
networks:
  default:
    external: true
    name: adscope
