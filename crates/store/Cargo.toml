[package]
name = "adss-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
adss-protocol = { path = "../protocol" }
anyhow = "1.0.100"
sea-orm = { version = "2.0.0-rc.38", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
