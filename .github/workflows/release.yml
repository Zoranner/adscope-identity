name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Verify workspace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo build --release --locked --workspace

      - name: Verify excluded crates
        shell: bash
        run: |
          set -euo pipefail
          for manifest in crates/store/Cargo.toml crates/protocol/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --manifest-path "$manifest" --all-targets --all-features -- -D warnings
            cargo test --manifest-path "$manifest" --all-targets --all-features
          done

  validate:
    name: Validate release tag
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" == "$version" || -z "$version" ]]; then
            echo "Release tag must have the form v<version>: $RELEASE_TAG" >&2
            exit 1
          fi

          for manifest in core/Cargo.toml portal/Cargo.toml syncer/Cargo.toml; do
            package_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' "$manifest")"
            if [[ "$package_version" != "$version" ]]; then
              echo "$manifest version $package_version does not match tag $RELEASE_TAG" >&2
              exit 1
            fi
          done

          echo "value=$version" >> "$GITHUB_OUTPUT"

  syncer:
    name: Build Windows Syncer
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Build and package Syncer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          cargo +1.93.1 build --release --locked -p adscope-syncer

          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          New-Item -ItemType Directory -Path release -Force | Out-Null
          wix build syncer\installer\AdscopeSyncer.wxs -arch x64 -ext WixToolset.UI.wixext -culture zh-cn `
            -d "SyncerBinary=$((Resolve-Path target\release\adscope-syncer.exe).Path)" `
            -d "ProductVersion=$env:VERSION" `
            -o "release\adscope-syncer-v$env:VERSION-windows-x64.msi"

      - uses: actions/upload-artifact@v6
        with:
          name: syncer-release
          path: release/adscope-syncer-v${{ needs.validate.outputs.version }}-windows-x64.msi
          if-no-files-found: error

  core:
    name: Build Linux Core
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and export Core image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ghcr.io/zoranner/adscope-core
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          docker build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            -f core/Dockerfile \
            .
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker save --output "release/adscope-core-v$VERSION-linux-amd64.tar" "$IMAGE:$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: core-release
          path: release/adscope-core-v${{ needs.validate.outputs.version }}-linux-amd64.tar
          if-no-files-found: error

  portal:
    name: Build Linux Portal
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and export Portal image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ghcr.io/zoranner/adscope-portal
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          docker build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            -f portal/Dockerfile \
            .
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker save --output "release/adscope-portal-v$VERSION-linux-amd64.tar" "$IMAGE:$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: portal-release
          path: release/adscope-portal-v${{ needs.validate.outputs.version }}-linux-amd64.tar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - validate
      - syncer
      - core
      - portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: syncer-release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: core-release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: portal-release
          path: release

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          core_archive="release/adscope-core-v$VERSION-linux-amd64.tar"
          portal_archive="release/adscope-portal-v$VERSION-linux-amd64.tar"
          syncer_installer="release/adscope-syncer-v$VERSION-windows-x64.msi"
          for artifact in "$core_archive" "$portal_archive" "$syncer_installer"; do
            test -f "$artifact" || { echo "Missing release artifact: $artifact" >&2; exit 1; }
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --title "$RELEASE_TAG" --generate-notes
          fi
