name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" == "$version" || -z "$version" ]]; then
            echo "Release tag must have the form v<version>: $RELEASE_TAG" >&2
            exit 1
          fi

          for manifest in center/Cargo.toml gateway/Cargo.toml connector/Cargo.toml; do
            package_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' "$manifest")"
            if [[ "$package_version" != "$version" ]]; then
              echo "$manifest version $package_version does not match tag $RELEASE_TAG" >&2
              exit 1
            fi
          done

          echo "value=$version" >> "$GITHUB_OUTPUT"

  connector:
    name: Build Windows Connector
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Build and package Connector
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          cargo +1.93.1 build --release --locked -p adscope-connector

          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          wix build connector\installer\AdscopeConnector.wxs -arch x64 `
            -d "ConnectorBinary=$((Resolve-Path target\release\adscope-connector.exe).Path)" `
            -d "ProductVersion=$env:VERSION" `
            -o "release\adscope-connector-v$env:VERSION-windows-x64.msi"

      - uses: actions/upload-artifact@v6
        with:
          name: connector-release
          path: release/adscope-connector-v${{ needs.validate.outputs.version }}-windows-x64.msi
          if-no-files-found: error

  center:
    name: Build Linux Center
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and export Center image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ghcr.io/zoranner/adscope-center
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          docker build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            .
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker save --output "release/adscope-center-v$VERSION-linux-amd64.tar" "$IMAGE:$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: center-release
          path: release/adscope-center-v${{ needs.validate.outputs.version }}-linux-amd64.tar
          if-no-files-found: error

  gateway:
    name: Build Linux Gateway
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and export Gateway image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ghcr.io/zoranner/adscope-gateway
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          docker build --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            -f gateway/Dockerfile \
            .
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker save --output "release/adscope-gateway-v$VERSION-linux-amd64.tar" "$IMAGE:$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: gateway-release
          path: release/adscope-gateway-v${{ needs.validate.outputs.version }}-linux-amd64.tar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - validate
      - connector
      - center
      - gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: connector-release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: center-release
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: gateway-release
          path: release

      - name: Generate release manifest and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          center_archive="release/adscope-center-v$VERSION-linux-amd64.tar"
          gateway_archive="release/adscope-gateway-v$VERSION-linux-amd64.tar"
          connector_installer="release/adscope-connector-v$VERSION-windows-x64.msi"
          for artifact in "$center_archive" "$gateway_archive" "$connector_installer"; do
            test -f "$artifact" || { echo "Missing release artifact: $artifact" >&2; exit 1; }
          done

          center_checksum="$(sha256sum "$center_archive" | awk '{print $1}')"
          gateway_checksum="$(sha256sum "$gateway_archive" | awk '{print $1}')"
          connector_checksum="$(sha256sum "$connector_installer" | awk '{print $1}')"
          jq -n \
            --arg version "$VERSION" \
            --arg revision "$REVISION" \
            --arg center_checksum "$center_checksum" \
            --arg gateway_checksum "$gateway_checksum" \
            --arg connector_checksum "$connector_checksum" \
            --arg center_name "$(basename "$center_archive")" \
            --arg gateway_name "$(basename "$gateway_archive")" \
            --arg connector_name "$(basename "$connector_installer")" \
            '{
              version: $version,
              revision: $revision,
              target: "windows-x86_64,linux-amd64",
              artifacts: [
                { name: $center_name, sha256: $center_checksum },
                { name: $gateway_name, sha256: $gateway_checksum },
                { name: $connector_name, sha256: $connector_checksum }
              ]
            }' > release/manifest.json
          printf '%s  %s\n%s  %s\n%s  %s\n' \
            "$center_checksum" "$(basename "$center_archive")" \
            "$gateway_checksum" "$(basename "$gateway_archive")" \
            "$connector_checksum" "$(basename "$connector_installer")" > release/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --title "$RELEASE_TAG" --generate-notes
          fi
